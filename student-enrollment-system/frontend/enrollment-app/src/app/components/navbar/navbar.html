<nav class="navbar">
  <div class="nav-brand">
    <span class="brand-icon">⬡</span>
    <span class="brand-name">EduEnroll</span>
  </div>
  <div class="nav-links">
    <a
      *ngFor="let item of navItems"
      [routerLink]="item.path"
      routerLinkActive="active"
      class="nav-link"
    >
      <span class="nav-icon">{{ item.icon }}</span>
      <span>{{ item.label }}</span>
    </a>
  </div>
</nav>
