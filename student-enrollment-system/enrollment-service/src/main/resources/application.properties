spring.application.name=enrollment-service
server.port=${PORT:8083}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/enrollment_db}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true
security.jwt.secret=${JWT_SECRET}
security.jwt.issuer=student-enrollment
clients.connect-timeout=${HTTP_CONNECT_TIMEOUT:2s}
clients.read-timeout=${HTTP_READ_TIMEOUT:5s}
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.maximum-pool-size=10
server.error.include-message=never
server.error.include-stacktrace=never
